name: 00 · Build and deploy SmartDocs.Web

# Reusable build + deploy for one SmartDocs.Web target.
#
# There is one App Service per site, and the site each host serves is decided entirely by the
# configuration overlay it is given — never by the code. That is why this workflow is called with
# an environment name and the path of an overlay, and knows nothing else about the target.
#
# This repository is PUBLIC. No storage account name, container name or App Service host name
# appears anywhere in it: every one of them arrives inside appsettings.<Environment>.json, checked
# out from the private smartdocs.internal repository. Storage identity stays in the file and is
# overlaid at startup by ConfigureAppConfiguration2; the App Service name is read out of the same
# file by this workflow and stripped before staging, so the host never receives a setting it would
# ignore. Keeping both in one file is what makes them impossible to mismatch — a secret holding the
# host name could silently point a deployment at the wrong overlay's target.

on:
  workflow_call:
    inputs:
      environment-name:
        description: Value of AppsettingsEnvironmentName; selects appsettings.<name>.json.
        required: true
        type: string
      runtime-identifier:
        description: Self-contained publish RID. Must match the App Service worker bitness.
        required: false
        default: win-x64
        type: string
      internal-config-path:
        description: Path of the overlay inside smartdocs.internal.
        required: false
        default: src/Diginsight.SmartDocs.Web/appsettings.Testmc.json
        type: string
      deployment-environment:
        description: GitHub environment containing deployment credentials.
        required: false
        default: testmc
        type: string
      publish-release:
        description: >-
          Publish the build output as a GitHub Release. Both deploy workflows build the same commit,
          so exactly one of them may set this, otherwise a single push would produce two releases.
          Requires contents: write on this job and on the calling workflow.
        required: false
        default: false
        type: boolean
    secrets:
      SMARTDOCS_INTERNAL_READ_TOKEN:
        description: Token with Contents read access to diginsight/smartdocs.internal.
        required: true
      AZURE_CLIENT_ID:
        description: Client ID for the Azure workload identity.
        required: true
      AZURE_TENANT_ID:
        description: Tenant ID for the Azure workload identity.
        required: true
      SMARTDOCS_INVALIDATE_KEY:
        description: Optional key used by the content invalidation endpoint.
        required: false
env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-deploy:
    runs-on: self-hosted
    environment: ${{ inputs.deployment-environment }}

    # OIDC: request a short-lived federated token from GitHub rather than storing a client secret.
    # contents stays read: a called workflow may not request more than its callers grant, and both
    # deploy workflows grant read. Enabling publish-release means raising this AND both callers to
    # contents: write.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GITHUB_TOKEN"))
          git init
          git remote remove origin 2>$null
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin main
          git checkout --force -B main FETCH_HEAD
          git clean -ffdx

      - name: Checkout configuration overlay from smartdocs.internal
        shell: pwsh
        env:
          INTERNAL_READ_TOKEN: ${{ secrets.SMARTDOCS_INTERNAL_READ_TOKEN }}
          INTERNAL_CONFIG_PATH: ${{ inputs.internal-config-path }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          if ([string]::IsNullOrWhiteSpace($env:INTERNAL_READ_TOKEN)) {
            Write-Error "SMARTDOCS_INTERNAL_READ_TOKEN was not provided to the reusable workflow"
            exit 1
          }
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:INTERNAL_READ_TOKEN"))
          $privatePath = ".private/smartdocs.internal"
          # No blob filter: a partial clone would defer the overlay's blob to a promisor fetch that
          # runs outside this command and so without the authorization header.
          git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 `
            -c "http.extraheader=AUTHORIZATION: basic $auth" `
            clone --depth=1 --no-tags --sparse `
            https://github.com/diginsight/smartdocs.internal.git $privatePath
          if ($LASTEXITCODE -ne 0) { Write-Error "Configuration overlay clone failed"; exit 1 }
          # Leading slash anchors the pattern to a single file rather than every matching suffix.
          git -C $privatePath -c "http.extraheader=AUTHORIZATION: basic $auth" `
            sparse-checkout set --no-cone "/$env:INTERNAL_CONFIG_PATH"
          if ($LASTEXITCODE -ne 0) { Write-Error "Configuration overlay sparse checkout failed"; exit 1 }

      - name: Verify .NET SDK
        shell: pwsh
        run: |
          # Use the SDK pre-installed on the self-hosted runner. actions/setup-dotnet installs into
          # C:\Program Files\dotnet, which the runner service account cannot write to.
          $v = dotnet --version
          if ($LASTEXITCODE -ne 0) { Write-Error "dotnet SDK not available on runner"; exit 1 }
          Write-Host "Using pre-installed .NET SDK: $v"
          if (-not ($v -like '10.*')) { Write-Error "Expected .NET 10 SDK, found $v"; exit 1 }

      - name: Download upstream Diginsight releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Diginsight versions pinned in src/Directory.Build.props are resolved from the
          # upstream GitHub Releases rather than nuget.org, so a coordinated change can be deployed
          # before the packages have propagated. Fails closed: a missing or corrupt upstream release
          # stops the build here instead of silently restoring an older version from nuget.org.
          ./eng/Download-PackageRelease.ps1

      - name: Compute version
        shell: pwsh
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
          VERSION_PREFIX: ${{ vars.VERSION_PREFIX || '1.0.0' }}
        run: |
          # Note: this reusable workflow is called separately by 01 and 02, so each target gets its
          # own run_number and therefore its own build number for the same commit. Treat the version
          # as "which build produced this deployment", not as a cross-environment identity.
          $offset = if ([string]::IsNullOrWhiteSpace($env:BUILD_NUMBER_OFFSET)) { 0 } else { [int] $env:BUILD_NUMBER_OFFSET }
          $version = "$env:VERSION_PREFIX.$([int] $env:BUILD_NUMBER + $offset)"
          Write-Host "Version: $version"
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish Diginsight.SmartDocs.Web
        shell: pwsh
        env:
          RID: ${{ inputs.runtime-identifier }}
        run: |
          # Self-contained, so the App Service needs no pre-installed .NET 10 runtime. The RID must
          # match the worker bitness: an x64 payload on a 32-bit worker fails to load with
          # "HTTP 500.32 - ANCM Failed to Load dll". The deploy step below sets the bitness to match.
          dotnet publish src/Diginsight.SmartDocs.Web/Diginsight.SmartDocs.Web.csproj `
            -c Release -r $env:RID --self-contained true `
            "-p:Version=$env:PACKAGE_VERSION" `
            -o publish_smartdocs
          if (-not (Test-Path "publish_smartdocs/Diginsight.SmartDocs.Web.exe")) {
            Write-Error "publish_smartdocs/Diginsight.SmartDocs.Web.exe missing after publish"
            exit 1
          }

      - name: Repair zero-byte Brotli assets
        shell: pwsh
        run: |
          # The runner's SDK can emit zero-byte Brotli siblings alongside valid original and gzip
          # assets, and matching endpoint metadata. Browsers then negotiate an empty payload and the
          # WASM runtime never starts. Drop only the broken variants, from disk and from the manifest,
          # so negotiation falls back to gzip/identity.
          $brokenBrotli = @(Get-ChildItem "publish_smartdocs/wwwroot/_framework" `
            -File -Recurse -Filter "*.br" | Where-Object Length -eq 0)
          if ($brokenBrotli.Count -gt 0) {
            $manifestPath = "publish_smartdocs/Diginsight.SmartDocs.Web.staticwebassets.endpoints.json"
            $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
            $brokenAssetFiles = @($brokenBrotli | ForEach-Object { "_framework/$($_.Name)" })
            $manifest.Endpoints = @($manifest.Endpoints | Where-Object { $_.AssetFile -notin $brokenAssetFiles })
            $manifest | ConvertTo-Json -Depth 100 -Compress | Set-Content $manifestPath -Encoding utf8NoBOM
            $brokenBrotli | ForEach-Object {
              Write-Host "Removed broken Brotli endpoint: $($_.Name)"
              Remove-Item -LiteralPath $_.FullName -Force
            }
          }

          $empty = @(Get-ChildItem "publish_smartdocs/wwwroot/_framework" -File -Recurse | Where-Object Length -eq 0)
          if ($empty.Count -gt 0) {
            $empty | ForEach-Object { Write-Error "Empty framework asset: $($_.FullName)" }
            Write-Error "Publish produced $($empty.Count) empty framework assets"
            exit 1
          }

      - name: Publish build output as a GitHub Release
        if: ${{ inputs.publish-release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        run: |
          # Deliberately packaged BEFORE the configuration overlay is staged. This repository is
          # public, and the overlay from smartdocs.internal carries storage identity and the App
          # Service host name, so the deployed zip must never become a release asset. What is
          # published here is the target-independent build output, which is what a rollback or an
          # audit actually needs.
          $tag = "v$env:PACKAGE_VERSION"
          $asset = "smartdocs-$env:PACKAGE_VERSION.zip"
          Compress-Archive -Path "publish_smartdocs/*" -DestinationPath $asset -Force

          # Only the environment overlay is disqualifying. The repository's own tracked
          # appsettings.<dev>.json files are part of a normal publish and carry nothing private.
          $overlayName = "appsettings.$env:ENVIRONMENT_NAME.json"
          if (Test-Path -LiteralPath (Join-Path "publish_smartdocs" $overlayName)) {
            Write-Error "Refusing to publish: environment overlay $overlayName is present in the payload"
            exit 1
          }

          (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant() + "  $asset" |
            Out-File -FilePath 'SHA256SUMS' -Encoding ascii

          # Idempotent: a re-run must not replace an existing published artifact.
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving it untouched."
          }
          else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
              --title $tag --notes "Automated SmartDocs.Web build $env:PACKAGE_VERSION." `
              $asset 'SHA256SUMS'
            if ($LASTEXITCODE -ne 0) { Write-Error "Could not create release $tag"; exit 1 }
            Write-Host "Published release $tag"
          }

      - name: Stage configuration overlay and resolve deployment target
        shell: pwsh
        env:
          OVERLAY: .private/smartdocs.internal/${{ inputs.internal-config-path }}
          ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        run: |
          # smartdocs.internal is authoritative for both storage identity and the deployment target.
          # Fail closed rather than deploy a host that would start with an unconfigured space and
          # serve nothing, or deploy the right payload to the wrong host.
          if (-not (Test-Path $env:OVERLAY)) {
            Write-Error "Configuration overlay missing from smartdocs.internal checkout: $env:OVERLAY"
            exit 1
          }
          $json = Get-Content $env:OVERLAY -Raw | ConvertFrom-Json
          if (-not $json.Site -or -not $json.Site.Spaces) {
            Write-Error "Overlay does not declare Site:Spaces"
            exit 1
          }
          if (-not $json.Deployment -or -not $json.Deployment.WebAppName) {
            Write-Error "Overlay does not declare Deployment:WebAppName"
            exit 1
          }

          # This repository is public, so the host name must not reach the log. Masking covers every
          # later step too, including the Azure CLI output below.
          $webAppName = $json.Deployment.WebAppName
          Write-Host "::add-mask::$webAppName"
          "WEBAPP_NAME=$webAppName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Deployment is workflow metadata, not application configuration. Strip it so the running
          # host is never handed a section it has no binding for.
          $json.PSObject.Properties.Remove('Deployment')

          $target = "publish_smartdocs/appsettings.$($env:ENVIRONMENT_NAME).json"
          $json | ConvertTo-Json -Depth 100 | Set-Content $target -Encoding utf8NoBOM
          Write-Host "Staged $target with $($json.Site.Spaces.Count) space(s)"

      - name: Azure login (OIDC)
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $oidc = Invoke-RestMethod `
            -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" } `
            -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange"
          az login --service-principal `
            --username $env:AZURE_CLIENT_ID --tenant $env:AZURE_TENANT_ID `
            --federated-token $oidc.value --output none
          if ($LASTEXITCODE -ne 0) { Write-Error "Azure OIDC login failed"; exit 1 }

      - name: Configure App Service
        shell: pwsh
        env:
          # The Azure CLI on the self-hosted runner bundles a 32-bit Python that prints a harmless
          # cryptography UserWarning to stderr on every invocation. Silence it to keep logs readable.
          PYTHONWARNINGS: ignore
          # WEBAPP_NAME arrives from the staging step through GITHUB_ENV, already masked.
          ENVIRONMENT_NAME: ${{ inputs.environment-name }}
          RID: ${{ inputs.runtime-identifier }}
          INVALIDATE_KEY: ${{ secrets.SMARTDOCS_INVALIDATE_KEY }}
        run: |
          $rg = az webapp list --query "[?name=='$env:WEBAPP_NAME'].resourceGroup | [0]" -o tsv
          if (-not $rg) { Write-Error "Could not resolve resource group for the target App Service"; exit 1 }

          # Worker bitness must match the published RID, otherwise the host answers HTTP 500.32.
          $use32 = if ($env:RID -eq 'win-x86') { 'true' } else { 'false' }
          az webapp config set --name $env:WEBAPP_NAME --resource-group $rg `
            --use-32bit-worker-process $use32 --net-framework-version v4.0 | Out-Null
          Write-Host "Worker bitness set for $env:RID (use32BitWorkerProcess=$use32)"

          # Only environment selection and the writable snapshot path are set here. Storage identity
          # stays inside the overlay so it never has to travel through this public repository.
          $settings = @(
            "AppsettingsEnvironmentName=$env:ENVIRONMENT_NAME",
            "ASPNETCORE_ENVIRONMENT=Production",
            "Site__MetricsSnapshotPath=D:\home\data\nav-metrics-snapshot.json"
          )
          if ($env:INVALIDATE_KEY) { $settings += "Site__InvalidateApiKey=$env:INVALIDATE_KEY" }

          az webapp config appsettings set `
            --name $env:WEBAPP_NAME --resource-group $rg `
            --settings $settings | Out-Null
          Write-Host "App settings updated"

      - name: Deploy to App Service
        shell: pwsh
        env:
          PYTHONWARNINGS: ignore
        run: |
          Compress-Archive -Path "publish_smartdocs/*" -DestinationPath "smartdocs-deploy.zip" -Force
          $sizeMb = [math]::Round((Get-Item "smartdocs-deploy.zip").Length / 1MB, 1)
          Write-Host "Deploy payload: $sizeMb MB"

          # Kudu basic authentication is disabled on these sites, so `az webapp deploy` — which
          # publishes with basic credentials — gets 401. Kudu does accept the Entra token from the
          # OIDC login above, so publish straight to OneDeploy with it. This keeps basic auth off.
          $token = az account get-access-token --resource https://management.azure.com --query accessToken -o tsv
          if ([string]::IsNullOrWhiteSpace($token)) { Write-Error "Could not acquire an Entra token"; exit 1 }
          $headers = @{ Authorization = "Bearer $token" }
          $base = "https://$env:WEBAPP_NAME.scm.azurewebsites.net"

          # Identifies the deployment this run creates, so polling cannot report the previous one.
          $previousId = try { (Invoke-RestMethod -Uri "$base/api/deployments/latest" -Headers $headers -TimeoutSec 120).id } catch { $null }

          # async=true returns as soon as the upload lands: a synchronous publish of ~75 MB can
          # outlast the App Service 230-second front-end timeout even when the deployment succeeds.
          $uploaded = $false
          foreach ($attempt in 1..3) {
            try {
              $response = Invoke-WebRequest -Uri "$base/api/publish?type=zip&async=true" -Method Post `
                -Headers $headers -InFile "smartdocs-deploy.zip" -ContentType "application/octet-stream" `
                -TimeoutSec 900 -UseBasicParsing
              Write-Host "Upload accepted (HTTP $($response.StatusCode))"
              $uploaded = $true
              break
            }
            catch {
              Write-Host "Upload attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -lt 3) { Start-Sleep -Seconds 30 }
            }
          }
          if (-not $uploaded) { Write-Error "Could not upload the deployment package"; exit 1 }

          # Kudu deployment status: 3 = failed, 4 = success.
          foreach ($poll in 1..90) {
            Start-Sleep -Seconds 10
            try { $deployment = Invoke-RestMethod -Uri "$base/api/deployments/latest" -Headers $headers -TimeoutSec 120 }
            catch { Write-Host "Status poll $poll failed: $($_.Exception.Message)"; continue }
            if ($deployment.id -eq $previousId) { continue }
            if (-not $deployment.complete) { continue }
            if ($deployment.status -eq 4) { Write-Host "Deployment $($deployment.id) succeeded"; exit 0 }
            Write-Error "Deployment $($deployment.id) failed: status=$($deployment.status) $($deployment.status_text) $($deployment.message)"
            exit 1
          }
          Write-Error "Deployment did not complete within 15 minutes"
          exit 1

      - name: Smoke check
        shell: pwsh
        env:
          PYTHONWARNINGS: ignore
        run: |
          # A deploy that returns success while the host fails to start is the failure mode worth
          # catching here: the payload is self-contained, so a bitness or overlay mistake shows up
          # only on the first request.
          if ([string]::IsNullOrWhiteSpace($env:WEBAPP_NAME)) {
            Write-Error "WEBAPP_NAME was not resolved from the overlay"
            exit 1
          }
          $rg = az webapp list --query "[?name=='$env:WEBAPP_NAME'].resourceGroup | [0]" -o tsv
          # $host is a PowerShell automatic variable and cannot be assigned.
          $hostName = az webapp show --name $env:WEBAPP_NAME --resource-group $rg --query defaultHostName -o tsv
          if ([string]::IsNullOrWhiteSpace($hostName)) {
            # Both deploy workflows share this runner and its az CLI session, so a sibling job
            # logging out can empty this lookup. The default hostname is deterministic, so derive it
            # rather than probing https:/// ten times and reporting a misleading failure.
            $hostName = "$env:WEBAPP_NAME.azurewebsites.net"
            Write-Host "Hostname lookup returned nothing; using the default hostname"
          }
          $url = "https://$hostName/"
          for ($i = 1; $i -le 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
              Write-Host "Attempt ${i}: HTTP $($r.StatusCode)"
              if ($r.StatusCode -eq 200) { exit 0 }
            }
            catch {
              Write-Host "Attempt ${i}: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 15
          }
          Write-Error "Site did not return HTTP 200 after deployment"
          exit 1
