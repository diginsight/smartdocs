name: 02 · Deploy docs site

# Deploys SmartDocs.Web to the documentation host, which publishes the repository-derived spaces
# (diginsight.telemetry, diginsight.smartcache, diginsight.components, …).
#
# Identical code, identical build, different overlay. Nothing here distinguishes this deployment
# from the Learning Hub one except the environment name and the target host secret — which is the
# property that makes "one codebase, two deployments" checkable rather than merely asserted.

on:
  push:
    branches: [main]
    paths:
      - src/Diginsight.SmartDocs.Web/**
      - src/Diginsight.SmartDocs.Web.Client/**
      - src/Diginsight.SmartDocs.Web.Shared/**
      # Documentation lives in src/docs and is published by 03; never redeploy the site for it.
      - '!src/Diginsight.SmartDocs.Web*/**.md'
      - src/Directory.Build.props
      - src/Directory.Build.targets
      - global.json
      - nuget.config
      - eng/**
      - .github/workflows/00.BuildSmartDocsWeb.yml
      - .github/workflows/02.DeployDocsSite.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-docssite
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/00.BuildSmartDocsWeb.yml
    secrets:
      SMARTDOCS_INTERNAL_READ_TOKEN: ${{ secrets.SMARTDOCS_INTERNAL_READ_TOKEN }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      SMARTDOCS_INVALIDATE_KEY: ${{ secrets.SMARTDOCS_INVALIDATE_KEY }}
    with:
      environment-name: TestmcDocs
      runtime-identifier: win-x64
      internal-config-path: src/Diginsight.SmartDocs.Web/appsettings.TestmcDocs.json
      deployment-environment: testmcdocs
